name: Frontend Validation

on:
  pull_request:
    paths:
      - assets/**
      - .github/workflows/frontend-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, typecheck, and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_HOST: https://api.example.invalid
      NEXT_PUBLIC_SUPPORT_TICKET_ENDPOINT: https://support.example.invalid
      NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: https://contact.example.invalid
      NEXT_PUBLIC_CAPTCHA_SITE_KEY: test-site-key
      NEXT_PUBLIC_DEPLOYMENT_ENV: test
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_frontend_validation
    defaults:
      run:
        working-directory: assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify dependency tree
        run: npm ls

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify instant navigations
        run: npm run test:e2e
