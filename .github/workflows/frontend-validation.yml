name: Frontend Validation

on:
  pull_request:
    paths:
      - assets/**
      - .github/workflows/frontend-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, typecheck, and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_HOST: https://api.example.invalid
      NEXT_PUBLIC_SUPPORT_TICKET_ENDPOINT: https://support.example.invalid
      NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: https://contact.example.invalid
      NEXT_PUBLIC_CAPTCHA_SITE_KEY: test-site-key
      NEXT_PUBLIC_DEPLOYMENT_ENV: test
    defaults:
      run:
        working-directory: assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@24.13.0
          cache: true
          package-json-file: assets/package.json
          cache-dependency-path: assets/pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependency tree
        run: pnpm list --depth Infinity

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Verify instant navigations
        run: pnpm test:e2e
