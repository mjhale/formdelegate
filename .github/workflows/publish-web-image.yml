name: Publish Web Image

on:
  push:
    branches:
      - main
    paths:
      - assets/**
      - .github/workflows/publish-web-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-web-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/mjhale/formdelegate-web
  NEXT_PUBLIC_API_HOST: ${{ vars.NEXT_PUBLIC_API_HOST }}
  NEXT_PUBLIC_SUPPORT_TICKET_ENDPOINT: ${{ vars.NEXT_PUBLIC_SUPPORT_TICKET_ENDPOINT }}
  NEXT_PUBLIC_CONTACT_FORM_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
  NEXT_PUBLIC_CAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_CAPTCHA_SITE_KEY }}
  NEXT_PUBLIC_DEPLOYMENT_ENV: ${{ vars.NEXT_PUBLIC_DEPLOYMENT_ENV }}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

jobs:
  publish:
    name: Build and publish web image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frontend build configuration
        run: |
          required_vars=(
            NEXT_PUBLIC_API_HOST
            NEXT_PUBLIC_SUPPORT_TICKET_ENDPOINT
            NEXT_PUBLIC_CONTACT_FORM_ENDPOINT
            NEXT_PUBLIC_CAPTCHA_SITE_KEY
            NEXT_PUBLIC_DEPLOYMENT_ENV
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "::error title=Missing GitHub Actions variable::${var_name} is required to build the web image"
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./assets
          file: ./assets/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_HOST=${{ env.NEXT_PUBLIC_API_HOST }}
            NEXT_PUBLIC_SUPPORT_TICKET_ENDPOINT=${{ env.NEXT_PUBLIC_SUPPORT_TICKET_ENDPOINT }}
            NEXT_PUBLIC_CONTACT_FORM_ENDPOINT=${{ env.NEXT_PUBLIC_CONTACT_FORM_ENDPOINT }}
            NEXT_PUBLIC_CAPTCHA_SITE_KEY=${{ env.NEXT_PUBLIC_CAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_DEPLOYMENT_ENV=${{ env.NEXT_PUBLIC_DEPLOYMENT_ENV }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha,scope=formdelegate-web
          cache-to: type=gha,scope=formdelegate-web,mode=max
